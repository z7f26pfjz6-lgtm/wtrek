name: TorresHike monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torreshike-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send test message on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import os
          from monitor import notify
          assert os.environ.get("TELEGRAM_BOT_TOKEN"), "Missing bot token"
          assert os.environ.get("TELEGRAM_CHAT_ID"), "Missing chat ID"
          notify("✅ TorresHike: החיבור לטלגרם עובד. מתחיל בדיקת זמינות.")
          PY

      - name: Check availability
        run: python monitor.py --once --state state.json

      - name: Save notification history
        if: always()
        run: |
          if [ ! -f state.json ]; then
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("state.json")
          data = json.loads(p.read_text())
          for camp in data.get("camps", {}).values():
              camp.pop("checked_at", None)
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update notification history"
            git push
          fi
